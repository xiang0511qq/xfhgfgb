name: Build Quark uploader EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'quark_uploader.py'
      - '.github/workflows/build-quark-uploader.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 夸克网盘上传工具 quark_uploader.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 夸克网盘上传工具-Windows
          path: dist/夸克网盘上传工具.exe
