name: Build Thunder uploader EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'thunder_uploader.py'
      - '.github/workflows/build-thunder-uploader.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller requests boto3
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 迅雷网盘上传工具 thunder_uploader.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 迅雷网盘上传工具-Windows
          path: dist/迅雷网盘上传工具.exe
